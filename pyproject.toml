# LPB-Router 프로젝트 메타데이터 + 도구 설정 (패키징 gap 해소, Phase 13 권고 #5).
# 주 사용 흐름은 여전히 `python reproduce.py` / `python -m pytest tests/` 이며(레포는
# 루트를 sys.path에 넣는 네임스페이스 패키지 구조), 이 파일은 표준 메타데이터·의존성·
# pytest 설정을 제공한다. 점수 재현 환경은 numpy 1.26.x (requirements.txt 주석 참조).

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lpb-router"
version = "0.17.0"
description = "Latent-trait Pandora's Box Router — SK텔레콤 Efficient LLM Routing Challenge 출품작"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["llm-routing", "pandora-box", "optimal-stopping", "item-response-theory", "budget-pacing"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.26,<2.0",   # 점수 대조는 1.26.x 고정 (numpy 2.x에서 World F 0.8192→0.8189, 서열 불변)
  "pyyaml>=6.0",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
st = ["sentence-transformers>=3.0"]   # TextEncoder st 백엔드 (기본 hashing은 의존성 불필요)
tune = ["optuna>=3.0"]                 # tune.py 선택 백엔드 (기본은 의존성 0 내장 탐색기)
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["src*", "baselines*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
